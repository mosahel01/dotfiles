[font]
size = 15.0
# offset = { x = -1, y = 1 } # x: line spacing, y: letter spacing

[font.normal]
family = "Iosevka NF"
style = "Regular"

[font.bold]
family = "Iosevka NF"
style = "Bold"

[font.italic]
family = "Iosevka NF"
style = "Italic"

[font.bold_italic]
family = "Iosevka NF"
style = "bold_italic"

[window]
padding.x = 0
padding.y = 0
# dynamic_padding = true
# decorations = "None"

[selection]
save_to_clipboard = true

[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1.0"

[cursor]
style = { shape = "Underline", blinking = "Off" }
unfocused_hollow = true
thickness = 0.15

[scrolling]
history = 10000
multiplier = 10

