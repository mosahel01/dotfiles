[font]
size = 12.5
# offset = { x = -1, y = 1 } # x: line spacing, y: letter spacing

[font.normal]
family = "BerkeleyMono Nerd Font"
style = "Regular"

[font.bold]
family = "BerkeleyMono Nerd Font"
style = "Bold"

[font.italic]
family = "BerkeleyMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "BerkeleyMono Nerd Font"
style = "bold_italic"

[window]
padding.x = 0
padding.y = 0
decorations = "None"
dynamic_padding = true

[selection]
save_to_clipboard = true

[env]
TERM = "xterm-256color"
# WINIT_X11_SCALE_FACTOR = "1.0"

[cursor]
style = { shape = "Underline", blinking = "Off" }
unfocused_hollow = true
thickness = 0.15

[scrolling]
history = 10000
multiplier = 10

