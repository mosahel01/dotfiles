background {
    monitor =
    color = rgba(10, 10, 10, 1.0)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33 # Size of the dots
    dots_spacing = 0.15 # Spacing between dots
    dots_center = true
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    # font_color = rgba(255, 255, 255, 1.0)
    font_color = rgba(0, 0, 0, 1.0)
    placeholder_text = <i><span foreground="##000000">Password...</span></i>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}
