add_newline = false
# A minimal left prompt
format = """$directory$character"""
palette = "catppuccin_mocha"
# move the rest of the prompt to the right
right_format = """$all"""
command_timeout = 1000

[character]
vimcmd_symbol = "[N >>>](blue)"
success_symbol = '[➜](bold green)'

[directory.substitutions]
'~/tests/starship-custom' = 'work-project'

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '

[package]
symbol = " " # BUG: 📦 symbol causes duplication for no reason

[swift]
symbol = " "

[nix_shell]
symbol = "❄️ "

[mise]
disabled = false

[bun]
symbol = ' '

[rust]
symbol = " "

[python]
symbol = ' '
python_binary = "python3"
pyenv_version_name = true

[nodejs]
symbol = ' '

[golang]
format = '[ ](bold cyan)'

[docker_context]
symbol = ' '
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
