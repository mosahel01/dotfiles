set -g mouse on 
set -g base-index 1
set -g pane-base-index 1
set -g status-position top

set -g default-terminal "tmux-256color"
set-option -a terminal-features 'xterm-kitty:RGB'
set-option -ga terminal-features ',xterm-kitty:Tc'

# set -g status-style 'bg=#333333 fg=#5eacd3'
set -g status-style 'fg=#5eacd3'

# Extended keyboard support
set -s extended-keys on
set -as terminal-features 'xterm-kitty:extkeys'

set-window-option -g pane-base-index 1
set-option -g renumber-windows 1

bind r source-file $HOME/.tmux.conf \; display "Tmux config reloaded!"

# # Switch between tmux windows
# bind -n C-Tab next-window
# bind -n C-S-Tab previous-window

# switch tmux panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# switch window panes
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# enable vi mode 
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
